<div class="cookie-banner" *ngIf="visible" role="dialog" aria-live="polite" aria-label="Cookie notice">
  <div class="cookie-copy">
    <strong>{{ copy.title }}</strong>
    <p>{{ copy.text }}</p>
  </div>
  <div class="cookie-actions">
    <a routerLink="/terms" class="cookie-link">{{ copy.learnMore }}</a>
    <button type="button" class="cookie-accept" (click)="accept()">{{ copy.accept }}</button>
  </div>
</div>
