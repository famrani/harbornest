<header class="site-header">
  <div class="container header-bar">
    <a class="brand" routerLink="/" (click)="closeMenu()">
      <span class="brand-mark">⛵</span>
      <span class="brand-text">
        <strong>{{ config.shortBrandName }}</strong>
        <small>{{ t.header.tagline }}</small>
      </span>
    </a>

    <button class="menu-toggle" type="button" (click)="toggleMenu()" aria-label="Open menu">
      ☰
    </button>

    <nav class="main-nav" [class.open]="menuOpen">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">{{ t.nav.home }}</a>
      <a routerLink="/sorties" routerLinkActive="active" (click)="closeMenu()">{{ t.nav.outings }}</a>
      <a routerLink="/bateau" routerLinkActive="active" (click)="closeMenu()">{{ t.nav.boat }}</a>
      <a routerLink="/galerie" routerLinkActive="active" (click)="closeMenu()">{{ t.nav.gallery }}</a>
      <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">{{ t.nav.contact }}</a>
      <div class="lang-switch" aria-label="Language selector">
        <button type="button" [class.active]="currentLang === 'fr'" (click)="setLanguage('fr')">FR</button>
        <button type="button" [class.active]="currentLang === 'en'" (click)="setLanguage('en')">EN</button>
        <button type="button" [class.active]="currentLang === 'es'" (click)="setLanguage('es')">ES</button>
      </div>
      <a class="cta-link" routerLink="/contact" (click)="closeMenu()">{{ t.nav.quote }}</a>
    </nav>
  </div>
</header>
