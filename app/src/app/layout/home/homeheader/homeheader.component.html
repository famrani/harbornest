<header class="site-header">
  <div class="container header-bar">
    <a class="brand" routerLink="/" (click)="closeMenu()">
      <img class="brand-logo" src="assets/img/logo-Alegria.png" [alt]="content.brand + ' logo'" />
      <span class="brand-text">
        <strong>{{ content.brand }}</strong>
        <small>{{ content.brandTagline }}</small>
      </span>
    </a>

    <button class="menu-toggle" type="button" (click)="toggleMenu()" aria-label="Open menu">
      ☰
    </button>

    <nav class="main-nav" [class.open]="menuOpen">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">{{ content.nav.home }}</a>
      <a routerLink="/sorties" routerLinkActive="active" (click)="closeMenu()">{{ content.nav.outings }}</a>
      <a routerLink="/bateau" routerLinkActive="active" (click)="closeMenu()">{{ content.nav.boat }}</a>
      <a routerLink="/galerie" routerLinkActive="active" (click)="closeMenu()">{{ content.nav.gallery }}</a>
      <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">{{ content.nav.contact }}</a>
      <a routerLink="/crew" routerLinkActive="active" (click)="closeMenu()">{{ content.nav.crew }}</a>

      <div class="language-switcher">
        <select [value]="currentLanguage" (change)="changeLanguage($any($event.target).value)" aria-label="Language selector">
          <option value="fr">Français</option>
          <option value="en">English</option>
          <option value="es">Español</option>
        </select>
      </div>

      <a class="cta-link" routerLink="/contact" (click)="closeMenu()">{{ content.nav.quote }}</a>
    </nav>
  </div>
</header>
