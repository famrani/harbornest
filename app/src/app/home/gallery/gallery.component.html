<section class="page-hero">
  <div class="container narrow">
    <span class="eyebrow">{{ content.galleryPage.eyebrow }}</span>
    <h1>{{ content.galleryPage.title }}</h1>
    <p>{{ content.galleryPage.intro }}</p>
  </div>
</section>

<section class="section">
  <div class="container masonry">
    <img *ngFor="let image of content.galleryImages; let i = index"
         [src]="image"
         [alt]="content.brand + ' ' + (i + 1)" />
  </div>
</section>
