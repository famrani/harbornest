<section class="booking-process-page">
  <div class="container booking-process-shell">
    <span class="eyebrow">{{ copy.eyebrow }}</span>
    <h1>{{ copy.title }}</h1>
    <p class="intro">{{ copy.intro }}</p>

    <section class="booking-channels" *ngIf="copy.channels?.length">
      <h2>{{ copy.channelsTitle }}</h2>
      <div class="channel-grid">
        <article class="channel-card" *ngFor="let channel of copy.channels; trackBy: trackByTitle">
          <div class="channel-icon" *ngIf="channel.icon">{{ channel.icon }}</div>
          <h3>{{ channel.title }}</h3>
          <p>{{ channel.text }}</p>
          <a *ngIf="channel.link && channel.cta" [routerLink]="channel.link" class="channel-link">{{ channel.cta }}</a>
        </article>
      </div>
    </section>

    <section class="booking-steps">
      <h2>{{ copy.stepsTitle }}</h2>
      <div class="process-timeline">
        <article class="process-step" *ngFor="let step of copy.steps; let i = index; trackBy: trackByTitle">
          <div class="step-marker">{{ i + 1 }}</div>
          <div class="step-content">
            <h3>{{ step.title }}</h3>
            <p>{{ step.text }}</p>
            <ul *ngIf="step.bullets?.length">
              <li *ngFor="let bullet of step.bullets">{{ bullet }}</li>
            </ul>
          </div>
        </article>
      </div>
    </section>

    <div class="final-note-card">
      <p>{{ copy.finalNote }}</p>
      <a [routerLink]="copy.termsLink || '/terms'" class="terms-link">{{ copy.termsCta }}</a>
    </div>
  </div>
</section>
